  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rmal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c181db70-31f1-4467-86c5-313ccc2702cd\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n:root {\n  --sphere:        linear-gradient(135deg, #FF8EA9 0%, #9B00FF 50%, #14E9ED 100%);\n  --rainbow:       linear-gradient(135deg, rgba(255,98,0,.35) 0%, rgba(117,78,255,.75) 51%, rgba(0,144,255,.35) 100%);\n  --violet:        #5200E3;\n  --violet-deep:   #2C00D5;\n  --claude-orange: #D97757;\n  --claude-orange-dk:#B65C3E;\n  --ink:           #0A0B19;\n  --ink-soft:      #2A2833;\n  --ink-support:   #6E6B7B;\n  --ink-muted:     #918FA9;\n  --green:         #14A05A;\n  --green-bg:      rgba(20,160,90,0.08);\n}\n\nhtml, body {\n  font-family: 'League Spartan', ui-sans-serif, system-ui, sans-serif;\n  -webkit-font-smoothing: antialiased;\n  background: #EEF0F6;\n  color: var(--ink);\n}\n\n/* ════════ CANVAS ════════ */\n.page {\n  position: relative;\n  min-height: 100vh;\n  padding: 64px 32px 80px;\n  background:\n    radial-gradient(1200px 700px at 16% 0%, rgba(155,0,255,.06), transparent 60%),\n    radial-gradient(1100px 700px at 90% 6%, rgba(20,233,237,.06), transparent 60%),\n    #F3F5FA;\n  overflow: hidden;\n}\n.page::before {\n  content: \"\";\n  position: absolute;\n  top: -140px; left: 50%;\n  width: 1500px; height: 480px;\n  transform: translateX(-50%);\n  background: var(--rainbow);\n  filter: blur(150px);\n  opacity: 0.12;\n  pointer-events: none;\n}\n.wrap { position: relative; z-index: 2; max-width: 1240px; margin: 0 auto; }\n\n/* ════════ HEADER ════════ */\n.head { text-align: center; margin-bottom: 40px; }\n.head__lockup {\n  display: inline-flex; align-items: center; gap: 11px; margin-bottom: 18px;\n}\n.head__claude { width: 26px; height: 26px; color: var(--claude-orange); }\n.head__x { font-size: 13px; font-weight: 300; color: var(--ink-muted); }\n.head__magic { height: 19px; width: auto; }\n\n.head__kicker {\n  font-size: 14px; font-weight: 600; letter-spacing: 0.24em;\n  text-transform: uppercase; color: var(--violet); margin-bottom: 14px;\n}\n.head__title {\n  font-size: 52px; font-weight: 700; letter-spacing: -0.02em;\n  line-height: 1.05; color: var(--ink); margin-bottom: 14px;\n}\n.head__title .grad {\n  background: var(--sphere);\n  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;\n}\n.head__sub {\n  font-size: 19px; font-weight: 400; line-height: 1.5;\n  color: var(--ink-support); max-width: 760px; margin: 0 auto;\n}\n\n/* ════════ GUIDE BAND ════════ */\n.guide {\n  background: rgba(255,255,255,0.94);\n  border: 2px solid #fff;\n  border-radius: 24px;\n  box-shadow: 0 16px 40px rgba(7,0,200,0.08), 0 3px 8px rgba(7,0,200,0.04);\n  padding: 22px 28px;\n  margin-bottom: 36px;\n  display: flex; align-items: center; gap: 30px; flex-wrap: wrap;\n}\n.guide__path { display: flex; flex-direction: column; gap: 8px; flex: 1 1 250px; min-width: 240px; }\n.guide__label {\n  font-size: 12px; font-weight: 600; letter-spacing: 0.16em;\n  text-transform: uppercase; color: var(--violet);\n}\n.guide__crumbs { font-size: 15px; font-weight: 500; color: var(--ink-soft); line-height: 1.5; }\n.guide__crumbs b { font-weight: 600; color: var(--ink); }\n.guide__crumbs em { color: var(--ink-muted); font-style: normal; margin: 0 7px; }\n.guide__states { display: flex; gap: 16px; flex-wrap: wrap; flex: 2 1 440px; }\n.gstate { display: flex; align-items: flex-start; gap: 10px; flex: 1 1 175px; min-width: 165px; }\n.gstate__icon { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }\n.gstate__icon svg { width: 14px; height: 14px; }\n.gstate__txt { display: flex; flex-direction: column; gap: 2px; }\n.gstate__txt strong { font-size: 14.5px; font-weight: 600; color: var(--ink); }\n.gstate__txt span { font-size: 13px; font-weight: 400; color: var(--ink-support); line-height: 1.35; text-wrap: pretty; }\n.gstate--allow .gstate__icon   { background: var(--green-bg); color: var(--green); }\n.gstate--approve .gstate__icon { background: rgba(82,0,227,0.09); color: var(--violet); }\n.gstate--blocked .gstate__icon { background: rgba(145,143,169,0.16); color: var(--ink-muted); }\n\n/* ════════ FILTER BAR ════════ */\n.filters {\n  display: flex; flex-direction: column; align-items: center;\n  gap: 12px; margin-bottom: 40px;\n}\n.filters__row {\n  display: flex; flex-wrap: wrap; align-items: center;\n  justify-content: center; gap: 10px;\n}\n.filter-label {\n  font-size: 13px; font-weight: 600; letter-spacing: 0.14em;\n  text-transform: uppercase; color: var(--ink-muted); margin-right: 4px;\n  min-width: 72px; text-align: right;\n}\n.chip {\n  appearance: none; font-family: inherit; cursor: pointer;\n  font-size: 15px; font-weight: 500; letter-spacing: -0.005em;\n  color: var(--ink-soft);\n  background: rgba(255,255,255,0.88);\n  border: 1.5px solid rgba(82,0,227,0.16);\n  border-radius: 9999px; padding: 9px 18px;\n  display: inline-flex; align-items: center; gap: 8px;\n  transition: border-color 140ms, color 140ms, background 140ms, transform 120ms;\n}\n.chip:hover { border-color: var(--violet); color: var(--violet); }\n.chip__dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }\n.chip__count {\n  font-size: 12px; font-weight: 600; color: var(--ink-muted);\n  background: rgba(82,0,227,0.06); border-radius: 9999px; padding: 1px 8px;\n}\n.chip.is-active {\n  background: var(--ink); color: #fff; border-color: var(--ink); transform: translateY(-1px);\n}\n.chip.is-active .chip__count { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.85); }\n.chip.is-active:hover { color: #fff; }\n.chip[data-filter=\"rw\"].is-active     { background: var(--green); border-color: var(--green); }\n.chip[data-filter=\"interactive\"].is-active { background: var(--violet); border-color: var(--violet); }\n.chip[data-filter=\"ro\"].is-active     { background: var(--claude-orange-dk); border-color: var(--claude-orange-dk); }\n.chip[data-type=\"category\"].is-active { background: var(--violet); border-color: var(--violet); }\n\n/* ════════ GRID ════════ */\n.grid {\n  display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;\n}\n\n/* ════════ CARD ════════ */\n.card {\n  background: rgba(255,255,255,0.94);\n  border: 2px solid #fff;\n  border-radius: 24px;\n  box-shadow: 0 16px 40px rgba(7,0,200,0.08), 0 3px 8px rgba(7,0,200,0.04);\n  padding: 30px 32px 28px;\n  display: flex; flex-direction: column;\n}\n.card.is-hidden { display: none; }\n\n.card__head {\n  display: flex; align-items: center; gap: 16px;\n  padding-bottom: 22px; margin-bottom: 22px;\n  border-bottom: 1px solid rgba(82,0,227,0.09);\n}\n.tile {\n  width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;\n  display: grid; place-items: center;\n  font-size: 22px; font-weight: 700; color: #fff;\n  box-shadow: 0 4px 12px rgba(7,0,200,0.12);\n}\n.card__id { flex: 1; min-width: 0; }\n.card__name {\n  font-size: 23px; font-weight: 700; letter-spacing: -0.015em;\n  color: var(--ink); line-height: 1.1; margin-bottom: 7px;\n}\n.badge {\n  display: inline-flex; align-items: center; gap: 6px;\n  font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em;\n  border-radius: 9999px; padding: 4px 11px; white-space: nowrap;\n}\n.badge__dot { width: 7px; height: 7px; border-radius: 50%; }\n.badge--rw { color: var(--green); background: var(--green-bg); }\n.badge--rw .badge__dot { background: var(--green); }\n.badge--interactive { color: var(--violet); background: rgba(82,0,227,0.07); }\n.badge--interactive .badge__dot { background: var(--violet); }\n.badge--ro { color: var(--claude-orange-dk); background: rgba(217,119,87,0.10); }\n.badge--ro .badge__dot { background: var(--claude-orange); }\n\n.card__note {\n  font-size: 12.5px; font-weight: 500; color: var(--claude-orange-dk);\n  background: rgba(217,119,87,0.09); border-radius: 8px;\n  padding: 7px 11px; margin-bottom: 20px; line-height: 1.4;\n}\n\n/* single toggle per card */\n.caps__toggle {\n  display: flex; align-items: center; gap: 10px;\n  width: 100%; appearance: none; background: none; border: none;\n  font-family: inherit; cursor: pointer; padding: 0; text-align: left;\n  font-size: 12px; font-weight: 600; letter-spacing: 0.14em;\n  text-transform: uppercase; color: var(--ink-muted);\n  transition: opacity 140ms;\n}\n.caps__toggle:hover { opacity: 0.7; }\n.caps__toggle .lbl { flex-shrink: 0; white-space: nowrap; }\n.caps__pills { display: flex; align-items: center; gap: 7px; }\n.caps__pill {\n  font-size: 11px; font-weight: 600; letter-spacing: 0;\n  padding: 1px 8px; border-radius: 9999px; white-space: nowrap;\n}\n.caps__pill--can  { color: var(--green); background: var(--green-bg); }\n.caps__pill--cant { color: var(--ink-muted); background: rgba(145,143,169,0.12); }\n.caps__chev {\n  width: 13px; height: 13px; margin-left: auto; flex-shrink: 0;\n  color: var(--ink-muted); transition: transform 240ms ease;\n}\n.caps[data-collapsed=\"true\"] .caps__chev { transform: rotate(-90deg); }\n\n.caps__wrap { display: block; }\n.caps[data-collapsed=\"true\"] .caps__wrap { display: none; }\n.caps__grid {\n  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;\n  align-items: start; padding-top: 18px;\n}\n.caps__col { min-width: 0; }\n.caps__h {\n  display: flex; align-items: center; gap: 8px;\n  font-size: 12px; font-weight: 600; letter-spacing: 0.16em;\n  text-transform: uppercase; margin-bottom: 14px;\n}\n.caps__h--can { color: var(--green); }\n.caps__h--cant { color: var(--ink-muted); }\n.caps__icon { width: 16px; height: 16px; flex-shrink: 0; }\n.caps__list { list-style: none; display: flex; flex-direction: column; gap: 9px; }\n.caps__list li {\n  font-size: 14.5px; line-height: 1.38; color: var(--ink-soft);\n  padding-left: 20px; position: relative; text-wrap: pretty;\n}\n.caps__col--can li::before {\n  content: \"\"; position: absolute; left: 0; top: 6px;\n  width: 9px; height: 9px; border-radius: 50%;\n  background: var(--sphere);\n}\n.caps__col--cant li { color: var(--ink-support); }\n.caps__col--cant li::before {\n  content: \"\"; position: absolute; left: 1px; top: 9px;\n  width: 9px; height: 2px; border-radius: 2px;\n  background: var(--ink-muted); opacity: 0.7;\n}\n\n/* ════════ FOOTER ════════ */\n.foot {\n  text-align: center; margin-top: 44px;\n  font-size: 14.5px; color: var(--ink-muted); line-height: 1.6;\n}\n.foot strong { color: var(--ink-support); font-weight: 600; }\n\n.empty {\n  grid-column: 1 / -1; text-align: center; padding: 60px 0;\n  font-size: 18px; color: var(--ink-muted);\n}\n\n/* ════════ RESPONSIVE ════════ */\n@media (max-width: 980px) {\n  .grid { grid-template-columns: 1fr; }\n  .head__title { font-size: 40px; }\n}\n@media (max-width: 560px) {\n  .page { padding: 44px 18px 64px; }\n  .caps { grid-template-columns: 1fr; gap: 20px; }\n  .head__title { font-size: 32px; }\n  .head__sub { font-size: 17px; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"page\">\n  <div class=\"wrap\">\n\n    <!-- HEADER -->\n    <header class=\"head\">\n      <div class=\"head__lockup\">\n        <svg class=\"head__claude\" viewBox=\"75 223 150 150\" xmlns=\"http://www.w3.org/2000/svg\" aria-label=\"Claude\">\n          <path fill=\"currentColor\" d=\"m 105.01,322.07 29.14,-16.35 0.49,-1.42 -0.49,-0.79 h -1.42 l -4.87,-0.3 -16.65,-0.45 -14.44,-0.6 -13.99,-0.75 -3.52,-0.75 -3.3,-4.35 0.34,-2.17 2.96,-1.99 4.24,0.37 9.37,0.64 14.06,0.97 10.2,0.6 15.11,1.57 h 2.4 l 0.34,-0.97 -0.82,-0.6 -0.64,-0.6 -14.55,-9.86 -15.75,-10.42 -8.25,-6 -4.46,-3.04 -2.25,-2.85 -0.97,-6.22 4.05,-4.46 5.44,0.37 1.39,0.37 5.51,4.24 11.77,9.11 15.37,11.32 2.25,1.87 0.9,-0.64 0.11,-0.45 -1.01,-1.69 -8.36,-15.11 -8.92,-15.37 -3.97,-6.37 -1.05,-3.82 c -0.37,-1.57 -0.64,-2.89 -0.64,-4.5 l 4.61,-6.26 2.55,-0.82 6.15,0.82 2.59,2.25 3.82,8.74 6.19,13.76 9.6,18.71 2.81,5.55 1.5,5.14 0.56,1.57 h 0.97 v -0.9 l 0.79,-10.54 1.46,-12.94 1.42,-16.65 0.49,-4.69 2.32,-5.62 4.61,-3.04 3.6,1.72 2.96,4.24 -0.41,2.74 -1.76,11.44 -3.45,17.92 -2.25,12 h 1.31 l 1.5,-1.5 6.07,-8.06 10.2,-12.75 4.5,-5.06 5.25,-5.59 3.37,-2.66 h 6.37 l 4.69,6.97 -2.1,7.2 -6.56,8.32 -5.44,7.05 -7.8,10.5 -4.87,8.4 0.45,0.67 1.16,-0.11 17.62,-3.75 9.52,-1.72 11.36,-1.95 5.14,2.4 0.56,2.44 -2.02,4.99 -12.15,3 -14.25,2.85 -21.22,5.02 -0.26,0.19 0.3,0.37 9.56,0.9 4.09,0.22 h 10.01 l 18.64,1.39 4.87,3.22 2.92,3.94 -0.49,3 -7.5,3.82 -10.12,-2.4 -23.62,-5.62 -8.1,-2.02 h -1.12 v 0.67 l 6.75,6.6 12.37,11.17 15.49,14.4 0.79,3.56 -1.99,2.81 -2.1,-0.3 -13.61,-10.24 -5.25,-4.61 -11.89,-10.01 h -0.79 v 1.05 l 2.74,4.01 14.47,21.75 0.75,6.67 -1.05,2.17 -3.75,1.31 -4.12,-0.75 -8.47,-11.89 -8.74,-13.39 -7.05,-12 -0.86,0.49 -4.16,44.81 -1.95,2.29 -4.5,1.72 -3.75,-2.85 -1.99,-4.61 1.99,-9.11 2.4,-11.89 1.95,-9.45 1.76,-11.74 1.05,-3.9 -0.07,-0.26 -0.86,0.11 -8.85,12.15 -13.46,18.19 -10.65,11.4 -2.55,1.01 -4.42,-2.29 0.41,-4.09 2.47,-3.64 14.74,-18.75 8.89,-11.62 5.74,-6.71 -0.04,-0.97 h -0.34 l -39.15,25.42 -6.97,0.9 -3,-2.81 0.37,-4.61 1.42,-1.5 11.77,-8.1 -0.04,0.04 z\"><\u002Fpath>\n        <\u002Fsvg>\n        <span class=\"head__x\">×<\u002Fspan>\n        <img class=\"head__magic\" src=\"ef5d2a22-0a5d-41ca-9934-beaa10d87476\" alt=\"Magic\">\n      <\u002Fdiv>\n      <p class=\"head__kicker\">Connectors · Capabilities Reference<\u002Fp>\n      <h1 class=\"head__title\">What each connector <span class=\"grad\">can<\u002Fspan> do.<\u002Fh1>\n      <p class=\"head__sub\">The approved connectors for Magic assistants, and exactly where each one can read, write, or act. Filter by access level, then check a tool before you ask Claude to use it.<\u002Fp>\n    <\u002Fheader>\n\n    <!-- GUIDE BAND -->\n    <section class=\"guide\">\n      <div class=\"guide__path\">\n        <span class=\"guide__label\">Where to find this<\u002Fspan>\n        <span class=\"guide__crumbs\"><b>Customize<\u002Fb> <em>›<\u002Fem> <b>Connectors<\u002Fb> <em>›<\u002Fem> select a connector <em>›<\u002Fem> <b>Tool permissions<\u002Fb><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"guide__states\">\n        <div class=\"gstate gstate--allow\">\n          <span class=\"gstate__icon\"><svg viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M3 8.5l3 3 7-7\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span class=\"gstate__txt\"><strong>Always allow<\u002Fstrong><span>Claude runs the tool without asking.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"gstate gstate--approve\">\n          <span class=\"gstate__icon\"><svg viewBox=\"0 0 16 16\" fill=\"none\"><rect x=\"4\" y=\"3\" width=\"2.6\" height=\"10\" rx=\"1.3\" fill=\"currentColor\"><\u002Frect><rect x=\"9.4\" y=\"3\" width=\"2.6\" height=\"10\" rx=\"1.3\" fill=\"currentColor\"><\u002Frect><\u002Fsvg><\u002Fspan>\n          <span class=\"gstate__txt\"><strong>Needs approval<\u002Fstrong><span>Claude pauses for your OK each time.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"gstate gstate--blocked\">\n          <span class=\"gstate__icon\"><svg viewBox=\"0 0 16 16\" fill=\"none\"><circle cx=\"8\" cy=\"8\" r=\"6\" stroke=\"currentColor\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M4 4l8 8\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span class=\"gstate__txt\"><strong>Blocked<\u002Fstrong><span>Claude can't use the tool at all.<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- FILTERS -->\n    <div class=\"filters\" id=\"filters\">\n      <div class=\"filters__row\">\n        <span class=\"filter-label\">Access<\u002Fspan>\n        <button class=\"chip is-active\" data-type=\"access\" data-filter=\"all\" type=\"button\">All connectors <span class=\"chip__count\" id=\"count-all\">10<\u002Fspan><\u002Fbutton>\n        <button class=\"chip\" data-type=\"access\" data-filter=\"rw\" type=\"button\"><span class=\"chip__dot\" style=\"background:var(--green)\"><\u002Fspan>Read &amp; write <span class=\"chip__count\" id=\"count-rw\">7<\u002Fspan><\u002Fbutton>\n        <button class=\"chip\" data-type=\"access\" data-filter=\"interactive\" type=\"button\"><span class=\"chip__dot\" style=\"background:var(--violet)\"><\u002Fspan>Interactive <span class=\"chip__count\" id=\"count-interactive\">1<\u002Fspan><\u002Fbutton>\n        <button class=\"chip\" data-type=\"access\" data-filter=\"ro\" type=\"button\"><span class=\"chip__dot\" style=\"background:var(--claude-orange)\"><\u002Fspan>Read only <span class=\"chip__count\" id=\"count-ro\">2<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"filters__row\">\n        <span class=\"filter-label\">Category<\u002Fspan>\n        <button class=\"chip\" data-type=\"category\" data-filter=\"gws\" type=\"button\">Google Workspace <span class=\"chip__count\" id=\"count-gws\">3<\u002Fspan><\u002Fbutton>\n        <button class=\"chip\" data-type=\"category\" data-filter=\"productivity\" type=\"button\">Productivity <span class=\"chip__count\" id=\"count-productivity\">4<\u002Fspan><\u002Fbutton>\n        <button class=\"chip\" data-type=\"category\" data-filter=\"pm\" type=\"button\">Project Management <span class=\"chip__count\" id=\"count-pm\">2<\u002Fspan><\u002Fbutton>\n        <button class=\"chip\" data-type=\"category\" data-filter=\"design\" type=\"button\">Design <span class=\"chip__count\" id=\"count-design\">1<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- GRID -->\n    <div class=\"grid\" id=\"grid\"><\u002Fdiv>\n\n    <p class=\"foot\"><strong>Read &amp; write<\u002Fstrong> tools can change data in the app · <strong>Interactive<\u002Fstrong> tools act inside their own workspace · <strong>Read only<\u002Fstrong> tools can look but never change anything.<br>Capabilities reflect the current Magic connector set and may expand over time. Always review Claude's actions before they reach a client.<\u002Fp>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst CONNECTORS = [\n  {\n    id: \"gmail\", name: \"Gmail\", access: \"rw\", category: \"gws\", tile: \"M\", color: \"#EA4335\",\n    can: [\"Search threads & messages\",\"Read thread content\",\"Create & list draft emails\",\"Create, update & delete labels\",\"Label / unlabel threads & messages\",\"Trash emails (via TRASH label)\",\"List labels\"],\n    cant: [\"Send emails directly (drafts only)\",\"Permanently delete emails (trash only)\",\"Read attachment contents directly\",\"Remove CATEGORY_PRIMARY via API\"]\n  },\n  {\n    id: \"gcal\", name: \"Google Calendar\", access: \"rw\", category: \"gws\", tile: \"C\", color: \"#1A73E8\",\n    can: [\"List calendars & events\",\"Get event details\",\"Create events\",\"Update events\",\"Delete events (hard delete)\",\"Respond to event invites\",\"Suggest available times\"],\n    cant: [\"Create or delete calendars\",\"Manage recurring event series (instances only)\",\"Set calendar permissions\"]\n  },\n  {\n    id: \"gdrive\", name: \"Google Drive\", access: \"rw\", category: \"gws\", tile: \"D\", color: \"#34A853\",\n    can: [\"Search & list files\",\"Read & download file content\",\"Get file metadata & permissions\",\"Copy files\",\"Create new files (auto-converts to Google Docs)\",\"Upload files\"],\n    cant: [\"Delete files\",\"Edit / overwrite existing files\",\"Move files between folders\"]\n  },\n  {\n    id: \"slack\", name: \"Slack\", access: \"rw\", category: \"productivity\", tile: \"S\", color: \"#4A154B\",\n    can: [\"Send & schedule messages\",\"Create message drafts\",\"Read channels, threads & files\",\"Search channels (public + private)\",\"List channel members & user profiles\",\"Create conversations\",\"Create, read & update canvases\",\"Add / get reactions\",\"Search emojis & users\"],\n    cant: [\"Edit or delete sent messages\",\"Upload files\",\"Delete channels\"]\n  },\n  {\n    id: \"notion\", name: \"Notion\", access: \"rw\", category: \"productivity\", tile: \"N\", color: \"#0A0B19\",\n    can: [\"Search pages & databases\",\"Create & update pages\",\"Create databases & views\",\"Duplicate & move pages\",\"Create & get comments\",\"Get teams & users\",\"Fetch page content\",\"Update views & data sources\"],\n    cant: [\"Permanently delete pages\",\"Upload file attachments\",\"Manage workspace permissions\"]\n  },\n  {\n    id: \"canva\", name: \"Canva\", access: \"interactive\", category: \"design\", tile: \"C\", color: \"#00C4CC\",\n    can: [\"Search, create, copy & export designs\",\"Generate designs with AI\",\"Resize & merge designs\",\"Import designs from URL\",\"Move designs between folders\",\"Manage folders & brand kits\",\"Edit design content & elements\",\"Upload assets\",\"Comment on & reply to designs\",\"Publish brand templates\"],\n    cant: [\"Delete designs or files\",\"Delete folders\"]\n  },\n  {\n    id: \"asana\", name: \"Asana\", access: \"rw\", category: \"pm\", tile: \"A\", color: \"#F06A6A\",\n    can: [\"View & search tasks, projects & goals\",\"Create & update tasks with owners & due dates\",\"Set task priority & assignees\",\"Delete tasks\",\"Add comments to tasks\",\"Create & update goals & metrics\",\"Set task dependencies, dependents & parent\",\"Add or remove task followers\",\"Create projects & project status\"],\n    cant: [\"Delete projects or goals\",\"Manage billing or workspace settings\"]\n  },\n  {\n    id: \"clickup\", name: \"ClickUp\", access: \"rw\", category: \"pm\", tile: \"C\", color: \"#7B68EE\",\n    can: [\"Create, update & delete tasks\",\"Set task priority & details\",\"Add tags, links & dependencies\",\"Attach files to tasks\",\"Merge & move tasks\",\"Create folders, lists & reminders\",\"Create & manage documents & pages\",\"Track time on tasks\",\"Add comments & send team chat messages\"],\n    cant: [\"Delete spaces or folders\",\"Manage billing or workspace-level settings\"]\n  },\n  {\n    id: \"fathom\", name: \"Fathom\", access: \"ro\", category: \"productivity\", tile: \"F\", color: \"#4F46E5\",\n    can: [\"List & search past meetings\",\"Get meeting summaries\",\"Get full transcripts\",\"Get recordings by URL or call ID\",\"Find persons\",\"List teams & identity\"],\n    cant: [\"Schedule or create meetings\",\"Delete meetings or recordings\",\"Edit transcripts\",\"Any write operations (read-only connector)\"]\n  },\n  {\n    id: \"ms365\", name: \"Microsoft 365\", access: \"ro\", category: \"productivity\", tile: \"M\", color: \"#D83B01\",\n    note: \"Available on Team / Enterprise plans only.\",\n    can: [\"Search documents across SharePoint & OneDrive\",\"Analyze email threads in Outlook\",\"Get calendar event insights\",\"Review Teams chat conversations\",\"Summarize documents & communications\"],\n    cant: [\"Send emails or Teams messages\",\"Create or edit documents\",\"Create calendar events\",\"Any write operations (read-only connector)\"]\n  }\n];\n\nconst ACCESS_LABEL = { rw: \"Read & write\", interactive: \"Interactive\", ro: \"Read only\" };\n\nconst grid = document.getElementById(\"grid\");\n\nfunction cardHTML(c) {\n  const canLis  = c.can.map(t => `<li>${t}<\u002Fli>`).join(\"\");\n  const cantLis = c.cant.map(t => `<li>${t}<\u002Fli>`).join(\"\");\n  const note = c.note ? `<div class=\"card__note\">⊘ ${c.note}<\u002Fdiv>` : \"\";\n  return `\n  <article class=\"card\" data-access=\"${c.access}\" data-category=\"${c.category}\">\n    <div class=\"card__head\">\n      <div class=\"tile\" style=\"background:${c.color}\">${c.tile}<\u002Fdiv>\n      <div class=\"card__id\">\n        <div class=\"card__name\">${c.name}<\u002Fdiv>\n        <span class=\"badge badge--${c.access}\"><span class=\"badge__dot\"><\u002Fspan>${ACCESS_LABEL[c.access]}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    ${note}\n    <div class=\"caps\" data-collapsed=\"true\">\n      <button class=\"caps__toggle\" type=\"button\" aria-expanded=\"false\">\n        <span class=\"lbl\">Capabilities<\u002Fspan>\n        <span class=\"caps__pills\">\n          <span class=\"caps__pill caps__pill--can\">${c.can.length} can<\u002Fspan>\n          <span class=\"caps__pill caps__pill--cant\">${c.cant.length} can't<\u002Fspan>\n        <\u002Fspan>\n        <svg class=\"caps__chev\" viewBox=\"0 0 16 16\" fill=\"none\"><path d=\"M4 6l4 4 4-4\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>\n      <\u002Fbutton>\n      <div class=\"caps__wrap\"><div class=\"caps__inner\"><div class=\"caps__grid\">\n        <div class=\"caps__col caps__col--can\">\n          <div class=\"caps__h caps__h--can\">\n            <svg class=\"caps__icon\" viewBox=\"0 0 20 20\" fill=\"none\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"rgba(20,160,90,0.12)\"/><path d=\"M6 10.4l2.6 2.6L14 7.4\" stroke=\"#14A05A\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>\n            Can do\n          <\u002Fdiv>\n          <ul class=\"caps__list\">${canLis}<\u002Ful>\n        <\u002Fdiv>\n        <div class=\"caps__col caps__col--cant\">\n          <div class=\"caps__h caps__h--cant\">\n            <svg class=\"caps__icon\" viewBox=\"0 0 20 20\" fill=\"none\"><circle cx=\"10\" cy=\"10\" r=\"9\" fill=\"rgba(145,143,169,0.14)\"/><path d=\"M6.6 6.6l6.8 6.8M13.4 6.6l-6.8 6.8\" stroke=\"#918FA9\" stroke-width=\"1.8\" stroke-linecap=\"round\"/><\u002Fsvg>\n            Can't do\n          <\u002Fdiv>\n          <ul class=\"caps__list\">${cantLis}<\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Farticle>`;\n}\n\ngrid.innerHTML = CONNECTORS.map(cardHTML).join(\"\");\n\n// one toggle per card shows/hides both lists together\ngrid.addEventListener(\"click\", (e) => {\n  const btn = e.target.closest(\".caps__toggle\");\n  if (!btn) return;\n  const caps = btn.closest(\".caps\");\n  const collapsed = caps.getAttribute(\"data-collapsed\") === \"true\";\n  caps.setAttribute(\"data-collapsed\", String(!collapsed));\n  btn.setAttribute(\"aria-expanded\", String(collapsed));\n});\n\n// counts\nconst counts = { all: CONNECTORS.length, rw: 0, interactive: 0, ro: 0, gws: 0, productivity: 0, pm: 0, design: 0 };\nCONNECTORS.forEach(c => { counts[c.access]++; counts[c.category]++; });\n[\"all\",\"rw\",\"interactive\",\"ro\",\"gws\",\"productivity\",\"pm\",\"design\"].forEach(k => {\n  const el = document.getElementById(\"count-\" + k);\n  if (el) el.textContent = counts[k];\n});\n\n// filtering — single active filter across access & category groups\nconst chips = document.querySelectorAll(\".chip\");\nchips.forEach(chip => {\n  chip.addEventListener(\"click\", () => {\n    chips.forEach(c => c.classList.remove(\"is-active\"));\n    chip.classList.add(\"is-active\");\n    const type = chip.dataset.type;\n    const f = chip.dataset.filter;\n    let shown = 0;\n    document.querySelectorAll(\".card\").forEach(card => {\n      const match = (f === \"all\") ||\n        (type === \"category\" ? card.dataset.category === f : card.dataset.access === f);\n      card.classList.toggle(\"is-hidden\", !match);\n      if (match) shown++;\n    });\n    const empty = document.getElementById(\"empty\");\n    if (empty) empty.remove();\n    if (shown === 0) {\n      grid.insertAdjacentHTML(\"beforeend\", '<p class=\"empty\" id=\"empty\">No connectors in this group.<\u002Fp>');\n    }\n  });\n});\n<\u002Fscript>\n\n\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
